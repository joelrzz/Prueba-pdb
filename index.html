<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Información Suplementaria - Visualización Molecular</title>
  <!-- Carga el motor de JSmol desde el servidor oficial (o cambia a "jsmol/JSmol.min.js" si lo subes al repo) -->
  <script src="https://chemapps.stolaf.edu/jmol/jsmol/JSmol.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      height: 100vh;
      color: #1e293b;
      background-color: #f8fafc;
    }
    /* Menú lateral izquierdo */
    aside {
      width: 300px;
      background-color: #0f172a;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #334155;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid #1e293b;
    }
    .sidebar-header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #ffffff;
    }
    .sidebar-header p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 6px;
      line-height: 1.4;
    }
    .menu-list {
      list-style: none;
      padding: 12px;
      overflow-y: auto;
      flex: 1;
    }
    .menu-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: #cbd5e1;
      padding: 12px 14px;
      margin-bottom: 6px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.15s ease, color 0.15s ease;
      display: block;
    }
    .menu-btn:hover {
      background-color: #1e293b;
      color: #ffffff;
    }
    .menu-btn.active {
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 500;
    }
    /* Panel principal derecho */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow: hidden;
    }
    .viewer-header {
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 12px;
    }
    .viewer-header h2 {
      font-size: 1.35rem;
      color: #0f172a;
    }
    .viewer-header p {
      font-size: 0.9rem;
      color: #475569;
      margin-top: 4px;
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    .ctrl-btn {
      padding: 6px 12px;
      font-size: 0.85rem;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      color: #334155;
    }
    .ctrl-btn:hover {
      background: #f1f5f9;
    }
    #jsmol-container {
      flex: 1;
      width: 100%;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      overflow: hidden;
    }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      aside { width: 100%; max-height: 35vh; }
    }
  </style>
</head>
<body>

  <aside>
    <div class="sidebar-header">
      <h1>Información Suplementaria</h1>
      <p>Estructuras moleculares interactivas. Selecciona un sistema en la lista.</p>
    </div>
    <ul class="menu-list" id="menu-list"></ul>
  </aside>

  <main>
    <div class="viewer-header">
      <div>
        <h2 id="titulo-modelo">Cargando...</h2>
        <p id="desc-modelo"></p>
      </div>
      <div class="controls">
        <button class="ctrl-btn" onclick="ejecutarComando('reset;')">Centrar vista</button>
        <button class="ctrl-btn" onclick="ejecutarComando('spin toggle;')">Rotar ON/OFF</button>
        <button class="ctrl-btn" onclick="alternarFondo()">Fondo Blanco/Negro</button>
      </div>
    </div>
    <div id="jsmol-container"></div>
  </main>

  <script>
    // 1. LISTA DE ARCHIVOS (Edita solo este arreglo para agregar o modificar modelos)
    const modelos = [
      {
        nombre: "Sistema 1: Geometría optimizada",
        descripcion: "Estructura de equilibrio en estado fundamental.",
        archivo: "modelos/sistema1.jmol"
      },
      {
        nombre: "Sistema 2: Estado de transición",
        descripcion: "Configuración intermedia con distancias clave resaltadas.",
        archivo: "modelos/sistema2.jmol"
      },
      {
        nombre: "Sistema 3: Orbital frontera (HOMO)",
        descripcion: "Isosuperficie calculada con isovalor 0.03 a.u.",
        archivo: "modelos/sistema3.jmol"
      }
    ];

    let myJmol;
    let fondoOscuro = false;

    // 2. CONFIGURACIÓN DE JSMOL
    const Info = {
      width: "100%",
      height: "100%",
      debug: false,
      color: "0xFFFFFF",
      use: "HTML5",
      // Si subes la carpeta jsmol/ al repositorio, cambia esta ruta a: "jsmol/j2s"
      j2sPath: "https://chemapps.stolaf.edu/jmol/jsmol/j2s",
      script: `load "${modelos[0].archivo}";`,
      disableInitialConsole: true
    };

    // 3. GENERACIÓN DEL MENÚ E INICIALIZACIÓN DEL VISOR
    window.addEventListener("DOMContentLoaded", () => {
      const menuList = document.getElementById("menu-list");

      modelos.forEach((mod, index) => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.className = "menu-btn" + (index === 0 ? " active" : "");
        btn.textContent = mod.nombre;
        btn.onclick = () => seleccionarModelo(index, btn);
        li.appendChild(btn);
        menuList.appendChild(li);
      });

      document.getElementById("titulo-modelo").textContent = modelos[0].nombre;
      document.getElementById("desc-modelo").textContent = modelos[0].descripcion;

      Jmol.setDocument(0);
      myJmol = Jmol.getApplet("myJmol", Info);
      document.getElementById("jsmol-container").innerHTML = Jmol.getAppletHtml(myJmol);
    });

    // 4. CAMBIO DE ARCHIVO SIN RECARGAR LA PÁGINA
    function seleccionarModelo(index, botonActivo) {
      document.querySelectorAll(".menu-btn").forEach(b => b.classList.remove("active"));
      botonActivo.classList.add("active");

      const mod = modelos[index];
      document.getElementById("titulo-modelo").textContent = mod.nombre;
      document.getElementById("desc-modelo").textContent = mod.descripcion;

      Jmol.script(myJmol, `load "${mod.archivo}";`);
    }

    function ejecutarComando(cmd) {
      Jmol.script(myJmol, cmd);
    }

    function alternarFondo() {
      fondoOscuro = !fondoOscuro;
      Jmol.script(myJmol, `background ${fondoOscuro ? "black" : "white"};`);
    }
  </script>
</body>
</html>
